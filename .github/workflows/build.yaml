name: Build and smoke test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        app: [zabbix_agent, zabbix_agent2]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: |
          sh -n "${{ matrix.app }}/run.sh"
          sh -n tests/smoke.sh
      - name: Validate metadata and input handling
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 tests/validate.py
      - name: Build latest stable Alpine image
        run: docker build --pull --no-cache -t ha-zabbix-test "${{ matrix.app }}"
      - name: Test startup and configuration
        run: sh tests/smoke.sh "${{ matrix.app }}"
